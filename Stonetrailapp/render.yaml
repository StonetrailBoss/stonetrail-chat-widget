databases:
  - name: stonetrail-portal-postgres
    databaseName: stonetrail_portal
    user: stonetrail_portal
    plan: basic-256mb
    ipAllowList: []
services:
  - type: web
    name: stonetrail-portal
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: portal-uploads
      mountPath: /var/data/stonetrail
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stonetrail-portal-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: UPLOAD_ROOT
        value: /var/data/stonetrail
      - key: OPENAI_API_KEY
        sync: false

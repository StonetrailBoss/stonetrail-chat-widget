databases:
  - name: stonetrail-postgres
    databaseName: stonetrail
    user: stonetrail
services:
  - type: web
    name: stonetrail-guest-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: stonetrail-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDBEDS_API_KEY
        sync: false
      - key: CLOUDBEDS_PROPERTY_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_STAFF_NUMBERS
        sync: false
      - key: CORS_ORIGINS
        value: https://stonetrailvillas.com,https://www.stonetrailvillas.com
